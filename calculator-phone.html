<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e0e5ec">
<title>ماشین‌حساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#e0e5ec;--text-color:#4d5b68;--history-color:#7a8b9a;--shadow-light:#fff;--shadow-dark:#a3b1c6;--op-right-color:#0984e3;--op-top-color:#7a8b9a;--ac-color:#d63031;--glass-bg:rgba(255,255,255,.25);--glass-border:rgba(255,255,255,.6);--orb-1:rgba(9,132,227,.4);--orb-2:rgba(214,48,49,.3)}
body.dark{--bg-color:#24252a;--text-color:#e2e8f0;--history-color:#a0aec0;--shadow-light:#2c2d33;--shadow-dark:#1c1d21;--op-right-color:#4facfe;--op-top-color:#a0aec0;--ac-color:#ff6b6b;--glass-bg:rgba(30,31,36,.65);--glass-border:rgba(255,255,255,.08);--orb-1:rgba(79,172,254,.15);--orb-2:rgba(102,126,234,.15)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;user-select:none}body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:24px;overflow:hidden;background:var(--bg-color);color:var(--text-color);transition:background .6s ease}.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;animation:float 12s ease-in-out infinite alternate;pointer-events:none}.orb-1{width:350px;height:350px;background:var(--orb-1);top:5%;left:15%}.orb-2{width:300px;height:300px;background:var(--orb-2);bottom:5%;right:15%;animation-delay:-6s}@keyframes float{50%{transform:translate(50px,80px) scale(1.12)}100%{transform:translate(-35px,45px) scale(.92)}}
.theme-switch-wrapper{display:flex;align-items:center;gap:15px;z-index:1;background:var(--bg-color);padding:10px 20px;border-radius:30px;box-shadow:5px 5px 15px var(--shadow-dark),-5px -5px 15px var(--shadow-light);transition:all .6s ease}.theme-label{font-family:Orbitron,sans-serif;font-size:.76em;font-weight:700;letter-spacing:1px}.theme-switch{display:inline-block;height:30px;position:relative;width:56px}.theme-switch input{display:none}.slider{position:absolute;inset:0;background:var(--bg-color);cursor:pointer;border-radius:34px;box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);transition:.5s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:4px;bottom:4px;border-radius:50%;background:var(--op-right-color);box-shadow:2px 2px 5px var(--shadow-dark);transition:.4s cubic-bezier(.68,-.55,.265,1.55)}input:checked+.slider:before{transform:translateX(26px)}
.calculator{width:min(100%,360px);padding:25px;border-radius:32px;background:var(--bg-color);box-shadow:15px 15px 35px var(--shadow-dark),-15px -15px 35px var(--shadow-light);transition:background .6s,box-shadow .6s;z-index:1;position:relative;border:1px solid rgba(255,255,255,.04)}.display{position:relative;width:100%;height:110px;margin-bottom:24px;padding:15px 20px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;border-radius:20px;overflow:hidden;background:var(--glass-bg);backdrop-filter:blur(15px);border:1px solid var(--glass-border);box-shadow:0 10px 40px rgba(0,0,0,.1),inset 0 0 10px rgba(255,255,255,.1)}.glass-reflection{position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-25deg);animation:shine 6s infinite;pointer-events:none}@keyframes shine{20%,100%{left:200%}}body.dark .glass-reflection{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}#history{height:22px;color:var(--history-color);font:500 14px Orbitron,sans-serif;letter-spacing:1px}#value{width:100%;text-align:right;color:var(--text-color);font:700 clamp(1.2rem,8vw,2.5rem) Orbitron,sans-serif;overflow:hidden;white-space:nowrap;scrollbar-width:none}#value::-webkit-scrollbar{display:none}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.buttons button{border:0;background:var(--bg-color);color:var(--text-color);font-size:1.25em;font-weight:500;border-radius:50%;aspect-ratio:1;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:7px 7px 15px var(--shadow-dark),-7px -7px 15px var(--shadow-light);transition:transform .2s,box-shadow .2s,color .2s}.buttons button:hover{transform:translateY(-2px)}.buttons button:active,.buttons button.active{box-shadow:inset 5px 5px 10px var(--shadow-dark),inset -5px -5px 10px var(--shadow-light);color:var(--op-right-color);transform:scale(.94)}.buttons button.zero{grid-column:span 2;aspect-ratio:auto;border-radius:40px;justify-content:flex-start;padding-left:30px}.buttons button.dot{font:700 2em Orbitron,sans-serif;padding-bottom:12px}.buttons button.top-op{color:var(--op-top-color);font-size:1.05em}.buttons button#clear{color:var(--ac-color)}.buttons button.right-op{color:var(--op-right-color);font-size:1.6em}.buttons button.equal-btn{background:var(--op-right-color);color:#fff;box-shadow:5px 5px 15px rgba(0,0,0,.15),-5px -5px 15px var(--shadow-light)}.calculator.animate-switch{animation:pulse .45s ease}@keyframes pulse{50%{transform:scale(.97) translateY(3px)}}@media(max-height:650px){body{gap:12px;padding:12px}.calculator{padding:18px}.display{height:88px;margin-bottom:16px}.buttons{gap:10px}}


</style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div>
<div class="theme-switch-wrapper"><span class="theme-label" id="themeLabel">LIGHT MODE</span><label class="theme-switch" aria-label="تغییر پوسته"><input id="themeToggle" type="checkbox"><span class="slider round"></span></label></div>
<main class="calculator" aria-label="ماشین حساب">
<section class="display" id="display"><div class="glass-reflection"></div><div id="history" aria-live="polite"></div><div id="value" aria-live="polite">0</div></section>
<section class="buttons" aria-label="کلیدها">
<button class="top-op" data-action="clear" id="clear">AC</button><button class="top-op" data-action="sign">+/−</button><button class="top-op" data-action="percent">%</button><button class="right-op" data-op="÷">÷</button>
<button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="right-op" data-op="×">×</button>
<button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="right-op" data-op="−">−</button>
<button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="right-op" data-op="+">+</button>
<button class="zero" data-digit="0">0</button><button class="dot" data-action="dot">.</button><button class="equal-btn" data-action="equals">=</button>
</section></main>
<script>
const valueEl=document.getElementById('value'),historyEl=document.getElementById('history'),display=document.getElementById('display'),toggle=document.getElementById('themeToggle'),themeLabel=document.getElementById('themeLabel');
let current='0',previous=null,operator=null,replaceNext=false;
function fitValue(){valueEl.style.fontSize='';const min=19;while(valueEl.scrollWidth>valueEl.clientWidth&&parseFloat(getComputedStyle(valueEl).fontSize)>min){valueEl.style.fontSize=(parseFloat(getComputedStyle(valueEl).fontSize)-1)+'px'}}
function paint(){valueEl.textContent=current;historyEl.textContent=previous!==null?`${previous} ${operator||''}`:'';requestAnimationFrame(fitValue)}
function number(n){if(replaceNext){current=n;replaceNext=false}else if(current==='0')current=n;else if(current.length<15)current+=n;paint()}
function chooseOp(op){if(operator&&previous!==null&&!replaceNext)calculate();previous=current;operator=op;replaceNext=true;paint()}
function calculate(){if(previous===null||!operator)return;const a=Number(previous),b=Number(current);let r;switch(operator){case '+':r=a+b;break;case '−':r=a-b;break;case '×':r=a*b;break;case '÷':if(b===0){current='خطا';previous=null;operator=null;replaceNext=true;paint();return}r=a/b;break}historyEl.textContent=`${previous} ${operator} ${current} =`;current=String(Number(r.toPrecision(12)));previous=null;operator=null;replaceNext=true;valueEl.textContent=current;requestAnimationFrame(fitValue)}
function action(name){switch(name){case'clear':current='0';previous=null;operator=null;replaceNext=false;paint();break;case'dot':if(replaceNext){current='0.';replaceNext=false}else if(!current.includes('.'))current+='.';paint();break;case'sign':if(current!=='0'&&current!=='خطا')current=String(-Number(current));paint();break;case'percent':current=String(Number(current)/100);paint();break;case'equals':calculate();display.classList.remove('animate-flare');void display.offsetWidth;display.classList.add('animate-flare');break}}
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>number(b.dataset.digit)));document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>chooseOp(b.dataset.op)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
toggle.addEventListener('change',()=>{document.body.classList.toggle('dark',toggle.checked);themeLabel.textContent=toggle.checked?'DARK MODE':'LIGHT MODE';const c=document.querySelector('.calculator');c.classList.remove('animate-switch');void c.offsetWidth;c.classList.add('animate-switch')});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))number(e.key);else if(e.key==='.')action('dot');else if(e.key==='Enter'||e.key==='=')action('equals');else if(e.key==='Escape'||e.key==='Delete')action('clear');else if(e.key==='+')chooseOp('+');else if(e.key==='-')chooseOp('−');else if(e.key==='*')chooseOp('×');else if(e.key==='/'){e.preventDefault();chooseOp('÷')}});


</script>
</body></html>
